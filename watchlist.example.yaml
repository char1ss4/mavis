# Copy to watchlist.yaml (gitignored) and list the software you actually run.
# This file never leaves your machine.
#
# vendor/product are matched against NVD's CPE data. CVEs NVD hasn't analysed
# yet (most recent ones) are matched by searching the description for
# `keywords` instead, defaulting to the product name. Descriptions often
# mention a product only as context ("a fork of MySQL"), so specific
# phrases cut false matches.
watchlist:
  - name: flask
    vendor: palletsprojects
    product: flask
    version: "3.0"
  - name: mysql
    vendor: oracle
    product: mysql
    version: "8.0"
    keywords: ["Oracle MySQL"]
  - name: docker
    vendor: docker
    product: docker
    version: "27"
    keywords: ["Docker Engine", "Docker Desktop", "Moby"]
  - name: mosquitto
    vendor: eclipse
    product: mosquitto
    version: "2.0"
